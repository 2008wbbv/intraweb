name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl builds need a cross toolchain for the bundled SQLite. `cross`
      # supplies one in a container rather than us pinning apt packages.
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --bin intraweb
          else
            cargo build --release --target ${{ matrix.target }} --bin intraweb
          fi

      # install.sh fetches intraweb-<target>, so the asset name is the contract.
      - name: Name the artifact
        run: |
          cp target/${{ matrix.target }}/release/intraweb intraweb-${{ matrix.target }}
          chmod +x intraweb-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: intraweb-${{ matrix.target }}
          path: intraweb-${{ matrix.target }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: intraweb-*
          generate_release_notes: true
